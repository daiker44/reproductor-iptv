<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - IPTV</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --accent: #238636; --border: #30363d; --text: #c9d1d9; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #58a6ff; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e; }
    input, select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; }
    .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
    .btn-success { background: #238636; }
    .btn-danger { background: #da3633; }
    .btn-secondary { background: #30363d; }
    .user-list { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .user-list th, .user-list td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 13px; }
    .user-list th { background: #21262d; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-act { background: rgba(46,160,67,0.15); color: #3fb950; }
    .badge-ina { background: rgba(248,81,73,0.15); color: #f85149; }
    .m3u-row { display: flex; gap: 8px; margin-bottom: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Panel de Control IPTV</h1>

  <!-- CONFIGURACIÓN DE TOKEN -->
  <div class="card">
    <div class="form-group">
      <label>Token de Acceso GitHub (PAT)</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <button class="btn btn-secondary" onclick="guardarToken()">Cargar Usuarios</button>
  </div>

  <!-- FORMULARIO DE CREACIÓN/EDICIÓN -->
  <div class="card" id="form-card" style="display:none;">
    <h3 id="form-title" style="margin-bottom:15px;">Añadir Nuevo Usuario</h3>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="u-usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="text" id="u-pass">
    </div>
    <div class="form-group">
      <label>Dirección MAC</label>
      <input type="text" id="u-mac" placeholder="A1:B2:C3:D4:E5:F6">
    </div>
    <div class="form-group">
      <label>Fecha Expiración (AAAA-MM-DD)</label>
      <div style="display:flex; gap:8px;">
        <input type="date" id="u-exp">
        <button class="btn btn-secondary" onclick="addMeses(1)">+1 Mes</button>
        <button class="btn btn-secondary" onclick="addMeses(12)">+1 Año</button>
      </div>
    </div>
    <div class="form-group">
      <label>Estado</label>
      <select id="u-activo">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>
    </div>

    <!-- LISTAS M3U -->
    <div class="form-group">
      <label>Listas M3U Vinculadas</label>
      <div id="m3u-container"></div>
      <button class="btn btn-secondary" style="margin-top:5px; font-size:12px;" onclick="addM3URow()">+ Agregar Lista M3U</button>
    </div>

    <button class="btn btn-success" onclick="guardarUsuario()">Guardar Cambios en GitHub</button>
  </div>

  <!-- TABLA DE USUARIOS -->
  <div class="card" id="table-card" style="display:none;">
    <h3>Usuarios Registrados</h3>
    <table class="user-list">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>MAC</th>
          <th>Expiración</th>
          <th>Estado</th>
          <th>Listas</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  const REPO = "daiker44/reproductor-iptv";
  const FILE_PATH = "usuarios.json";
  let currentSha = "";
  let usuariosList = [];
  let editIndex = -1;

  window.onload = () => {
    const savedToken = localStorage.getItem("GH_ADMIN_TOKEN");
    if (savedToken) {
      document.getElementById('gh-token').value = savedToken;
      guardarToken();
    }
  };

  function guardarToken() {
    const token = document.getElementById('gh-token').value.trim();
    if (!token) return alert("Ingresa un Token válido.");
    localStorage.setItem("GH_ADMIN_TOKEN", token);
    cargarDesdeGitHub();
  }

  async function cargarDesdeGitHub() {
    const token = localStorage.getItem("GH_ADMIN_TOKEN");
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
        headers: { Authorization: `token ${token}` }
      });
      if (!res.ok) throw new Error("No se pudo conectar con GitHub.");
      
      const data = await res.json();
      currentSha = data.sha;
      const content = decodeURIComponent(escape(atob(data.content)));
      usuariosList = JSON.parse(content);

      document.getElementById('form-card').style.display = 'block';
      document.getElementById('table-card').style.display = 'block';
      renderizarTabla();
      resetForm();

    } catch (e) {
      alert("Error: " + e.message);
    }
  }

  function renderizarTabla() {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '';

    usuariosList.forEach((u, idx) => {
      const numListas = u.listas_m3u ? u.listas_m3u.length : (u.lista_m3u ? 1 : 0);
      tbody.innerHTML += `
        <tr>
          <td><b>${u.usuario}</b></td>
          <td>${u.mac || 'Sin MAC'}</td>
          <td>${u.expiracion || 'Sin límite'}</td>
          <td><span class="badge ${u.activo ? 'badge-act' : 'badge-ina'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
          <td>${numListas} listas</td>
          <td>
            <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="editarUsuario(${idx})">Editar</button>
            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="eliminarUsuario(${idx})">Borrar</button>
          </td>
        </tr>
      `;
    });
  }

  function addM3URow(nombre = "", url = "") {
    const container = document.getElementById('m3u-container');
    const div = document.createElement('div');
    div.className = 'm3u-row';
    div.innerHTML = `
      <input type="text" placeholder="Nombre (ej. Cine)" value="${nombre}" style="flex:1;">
      <input type="text" placeholder="URL M3U" value="${url}" style="flex:2;">
      <button class="btn btn-danger" style="padding:4px 8px;" onclick="this.parentElement.remove()">X</button>
    `;
    container.appendChild(div);
  }

  function addMeses(meses) {
    const d = new Date();
    d.setMonth(d.getMonth() + meses);
    document.getElementById('u-exp').value = d.toISOString().split('T')[0];
  }

  function editUsuario(idx) {
    editIndex = idx;
    const u = usuariosList[idx];
    document.getElementById('u-usuario').value = u.usuario;
    document.getElementById('u-pass').value = u.password;
    document.getElementById('u-mac').value = u.mac || '';
    document.getElementById('u-exp').value = u.expiracion || '';
    document.getElementById('u-activo').value = u.activo ? "true" : "false";

    document.getElementById('m3u-container').innerHTML = '';
    if (u.listas_m3u) {
      u.listas_m3u.forEach(l => addM3URow(l.nombre, l.url));
    } else if (u.lista_m3u) {
      addM3URow("Lista Principal", u.lista_m3u);
    }

    document.getElementById('form-title').innerText = "Editar Usuario: " + u.usuario;
  }

  function resetForm() {
    editIndex = -1;
    document.getElementById('u-usuario').value = '';
    document.getElementById('u-pass').value = '';
    document.getElementById('u-mac').value = '';
    document.getElementById('u-exp').value = '';
    document.getElementById('u-activo').value = 'true';
    document.getElementById('m3u-container').innerHTML = '';
    addM3URow("Lista Principal", "");
    document.getElementById('form-title').innerText = "Añadir Nuevo Usuario";
  }

  async function guardarUsuario() {
    const u = document.getElementById('u-usuario').value.trim();
    const p = document.getElementById('u-pass').value.trim();
    const mac = document.getElementById('u-mac').value.trim();
    const exp = document.getElementById('u-exp').value;
    const act = document.getElementById('u-activo').value === "true";

    if (!u || !p) return alert("Usuario y contraseña son obligatorios.");

    // Recopilar listas
    const m3uRows = document.querySelectorAll('.m3u-row');
    const listas = [];
    m3uRows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      if (inputs[1].value.trim()) {
        listas.push({
          nombre: inputs[0].value.trim() || "Lista",
          url: inputs[1].value.trim()
        });
      }
    });

    const userObj = {
      usuario: u,
      password: p,
      activo: act,
      expiracion: exp,
      mac: mac,
      listas_m3u: listas
    };

    if (editIndex >= 0) {
      usuariosList[editIndex] = userObj;
    } else {
      usuariosList.push(userObj);
    }

    await actualizarGitHub();
  }

  async function eliminarUsuario(idx) {
    if (!confirm("¿Seguro que deseas eliminar este usuario?")) return;
    usuariosList.splice(idx, 1);
    await actualizarGitHub();
  }

  async function actualizarGitHub() {
    const token = localStorage.getItem("GH_ADMIN_TOKEN");
    const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(usuariosList, null, 2))));

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
        method: "PUT",
        headers: {
          Authorization: `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Actualización de usuarios desde Panel Admin",
          content: newContent,
          sha: currentSha
        })
      });

      if (!res.ok) throw new Error("No se pudo guardar en GitHub.");

      const data = await res.json();
      currentSha = data.content.sha;
      alert("✅ Cambios guardados en GitHub correctamente.");
      renderizarTabla();
      resetForm();

    } catch (e) {
      alert("Error al actualizar: " + e.message);
    }
  }
</script>
</body>
</html>
